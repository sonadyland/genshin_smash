server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's content-hashed bundles can be cached across deployments.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Art PNGs and their JSON metadata keep stable names: revalidate both.
    # A missing asset must be a 404, not the SPA's HTML response.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js|mjs|json|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|wasm|mp3|ogg|wav|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
